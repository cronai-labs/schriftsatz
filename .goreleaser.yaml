version: 2

project_name: schriftsatz

before:
  hooks:
    # Deliberately no `go mod tidy`: it rewrites a tracked file, so a release
    # would mutate the tree it is releasing. `verify` is read-only, and the
    # tests include the check that the embedded assets match the canonical ones.
    - go mod verify
    - go test ./...

builds:
  - id: schriftsatz
    main: ./cmd/schriftsatz
    binary: schriftsatz
    env: [CGO_ENABLED=0]
    # -trimpath strips local filesystem paths, so the binary does not carry the
    # build machine's directory layout and two builds of the same commit agree.
    flags: [-trimpath]
    ldflags:
      - -s -w -X main.version={{ .Version }}
    goos: [darwin, linux]
    goarch: [amd64, arm64]
    mod_timestamp: '{{ .CommitTimestamp }}'

archives:
  - formats: [tar.gz]
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}
    files:
      - LICENSE
      - README.md
      - CHANGELOG.md
      # docs/** and NOT docs/**/*. goreleaser matches with gobwas/glob,
      # where ** spans separators and a trailing /* then demands a literal /
      # after it — so docs/**/* only matches at depth 2 or deeper and every
      # doc sits at depth 1. It matched nothing, goreleaser only warned, and
      # v0.1.0 shipped with no documentation in any tarball.
      - docs/**

checksum:
  name_template: checksums.txt

snapshot:
  version_template: '{{ incpatch .Version }}-next'

changelog:
  # Deliberately NOT `disable: true`. That setting looks harmless next to
  # --release-notes and silently breaks it: goreleaser loads the --release-notes
  # file inside this pipe's Run, and `disable` makes the pipe Skip, so the file
  # is never read and the release body renders empty. v0.1.1 shipped that way.
  #
  #   func (Pipe) Skip(ctx) { return ctx.Config.Changelog.Disable }
  #   func (Pipe) Run(ctx)  { ctx.ReleaseNotes = loadContent(ctx.ReleaseNotesFile) ... }
  #
  # With the pipe enabled it loads our notes, sets ReleaseNotes, and returns
  # before generating anything itself — so there is still exactly one changelog,
  # the git-cliff-generated CHANGELOG.md. goreleaser's own help says the flag
  # "will skip GoReleaser changelog generation", which is what we want.
  disable: false

# A Cask, not a Formula. goreleaser deprecated `brews` in v2.10 and hard-
# deprecated it in v2.16: formulae that install pre-compiled binaries were a
# workaround from before Linuxbrew supported casks, and casks are now the right
# shape for shipping a built binary.
homebrew_casks:
  - name: schriftsatz
    repository:
      owner: cronai-labs
      name: homebrew-tap
      token: '{{ .Env.HOMEBREW_TAP_TOKEN }}'
    homepage: https://github.com/cronai-labs/schriftsatz
    description: Markdown to print-ready PDF via pandoc and XeLaTeX, with a text layer that survives extraction
    # These are real homebrew-core formulae — including texlive, so the TeX
    # distribution is a declared dependency rather than a README instruction.
    dependencies:
      - formula: pandoc
      - formula: texlive
      - formula: poppler
    caveats: |
      schriftsatz drives pandoc and XeLaTeX; both are installed as dependencies.

      The binary carries its own Lua filters and LaTeX fragments:
        schriftsatz --list-assets
        schriftsatz --print-asset styles/text-layer.tex

      Install uv for the second-extractor cross-check in `schriftsatz verify`.

    # Without this, `brew install` produces a binary macOS kills on sight.
    #
    # The darwin binaries are cross-compiled on a Linux runner. Go's linker
    # ad-hoc signs them, and that signature is valid — `codesign -v` returns 0.
    # What fails is Gatekeeper: Homebrew tags cask downloads with
    # com.apple.quarantine, and an ad-hoc-signed, non-notarized binary is
    # rejected. The process dies with SIGKILL (exit 137) before main() runs, so
    # it cannot report anything. Verified byte-identical: quarantined -> 137,
    # `xattr -c` -> runs.
    #
    # Be clear about what this costs. Removing the attribute removes
    # Gatekeeper's check that the binary comes from an identified developer.
    # The correct fix is a Developer ID signature plus notarization, which
    # needs a paid Apple Developer account; until then this hook is what makes
    # the cask work at all, and users are trusting this tap directly.
    hooks:
      post:
        install: |
          if OS.mac?
            system_command "/usr/bin/xattr",
                           args: ["-dr", "com.apple.quarantine", "#{staged_path}/schriftsatz"]
          end

release:
  draft: false
  prerelease: auto
  mode: keep-existing
