name: Release

# The sole trigger is a maintainer pushing an annotated tag. This workflow never
# creates, moves or deletes a tag, and never writes back to main — main is
# protected, and a workflow that pushes to it would need a bypass that defeats
# the point of protecting it.
on:
  push:
    tags: ['v*']

permissions:
  contents: read

# Never cancel a release in flight: a run interrupted between "create" and
# "upload asset" leaves a published release with missing assets.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write        # required to create the release and upload assets
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with: { fetch-depth: 0 }

      - name: The tag must be semver, and must match the version in the tool
        env:
          REF: ${{ github.ref_name }}
        run: |
          tag="$REF"
          # A case glob accepts v01.2.3 and v1.2.3-rc.1; this does not.
          if ! printf '%s' "$tag" | grep -qE '^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$'; then
            echo "::error::tag is not a plain vMAJOR.MINOR.PATCH: $tag"
            exit 1
          fi
          version="${tag#v}"
          # CHANGELOG.md is the single source of truth: the version reaches the
          # binary through -ldflags, so there is no constant in the source that
          # could disagree with it.
          declared="$(sed -n 's/^## \[\([0-9][^]]*\)\].*/\1/p' CHANGELOG.md | head -1)"
          if [ "$version" != "$declared" ]; then
            echo "::error::tag $tag disagrees with the newest CHANGELOG section ($declared)"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_ENV"

      - name: The tag must point at a commit reachable from main
        run: |
          git fetch --quiet origin main
          # Release only what is on the mainline. A tag on a side branch would
          # publish code that never passed the default-branch gate.
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main \
            || { echo "::error::tagged commit is not an ancestor of main"; exit 1; }

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Generate the release notes from the commit history
        # git-cliff, not an awk over a hand-written file: the history is the
        # single source. Squash-merging puts each pull request's description into
        # the commit body, and cliff.toml renders bodies, so the notes carry the
        # full prose rather than a list of subjects.
        uses: orhun/git-cliff-action@f50e11560dce63f7c33227798f90b924471a88b5  # v4.8.0
        id: cliff
        with:
          config: cliff.toml
          # --current, not --unreleased. This workflow is triggered BY a tag
          # push, so by the time it runs the tag exists and nothing is
          # "unreleased" — that flag yields the version heading and no entries.
          # --current selects the release containing the tagged commit.
          args: --current --strip header
        env:
          OUTPUT: /tmp/release-notes.md

      - name: The notes must contain entries
        run: |
          # Count ENTRIES, not bytes. v0.1.0 shipped an empty body past a `-s`
          # check because git-cliff emitted a version heading and nothing else:
          # 23 bytes, zero entries, and -s is true for any non-empty file.
          entries=$(grep -c '^- ' /tmp/release-notes.md || true)
          if [ "${entries:-0}" -lt 1 ]; then
            echo "::error::git-cliff produced no entries for $version"
            echo "--- what it produced ---"; cat /tmp/release-notes.md
            exit 1
          fi
          echo "$entries entries"
          echo "--- notes ---"; cat /tmp/release-notes.md

      - name: Publish with goreleaser
        # goreleaser builds every platform, checksums them, creates the release
        # and pushes the Homebrew cask to cronai-labs/homebrew-tap. It replaces
        # a hand-rolled tarball step, so the packaging path is exercised on
        # every release rather than first tested when one is needed.
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94  # v7.2.3
        with:
          # Pinned in .tool-versions, which tests/release-dryrun.sh reads to pick
          # its container image. A rehearsal against a different goreleaser than
          # the one that publishes is not a rehearsal, and the two drifting apart
          # is exactly what nobody notices until a release. One file, one bump.
          version-file: .tool-versions
          args: release --clean --release-notes=/tmp/release-notes.md
        env:
          GITHUB_TOKEN: ${{ github.token }}
          # A token scoped to the tap repository only. The default GITHUB_TOKEN
          # cannot push to another repository, and widening it would give every
          # workflow in this repo write access to the tap.
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}

      - name: The PUBLISHED release must actually carry the notes
        # Verify the outcome, not the input. The previous guard checked the
        # notes FILE — goreleaser's input — and passed while goreleaser went on
        # to publish an empty body, so two releases in a row shipped empty past
        # a check meant to prevent exactly that. Read back what GitHub now
        # serves; nothing downstream can fool this.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          body=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json body --jq .body)
          entries=$(printf '%s\n' "$body" | grep -c '^- ' || true)
          printf 'published body: %s bytes, %s entries\n' "$(printf '%s' "$body" | wc -c | tr -d ' ')" "${entries:-0}"
          if [ "${entries:-0}" -lt 1 ]; then
            echo "::error::the published release body carries no entries"
            printf -- '--- what was published ---\n%s\n' "$body"
            exit 1
          fi
