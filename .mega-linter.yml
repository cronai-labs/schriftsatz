# MegaLinter configuration — https://megalinter.io
#
# This replaces a hand-rolled `make lint` that invoked shellcheck, go vet,
# gofmt, luacheck and actionlint directly, each from whatever version happened
# to be installed. That is not a style preference: shellcheck 0.11.0 locally and
# 0.9.0 in CI disagree twice over — 0.9.0 flags `cd X && cmd || true` as SC2015,
# and mis-parses an escaped `##` inside a command substitution, reporting it as
# a missing `fi` three hundred lines away. A gate that passes locally and fails
# in CI teaches people to stop trusting it. A pinned container is one version
# everywhere.
#
# Deliberately a whitelist. Two exceptions worth knowing:
#
#   * Lua is NOT linted here. LUA_LUACHECK exists as a MegaLinter descriptor but
#     ships in no flavor, and pulling the full image to lint two files is a poor
#     trade. luacheck runs against filters/ from `make lint`, with lua-check
#     apt-installed in the pdf job — so it is enforced, just not from here.
#   * Secret scanning stays a separate gitleaks step in ci.yml. The scanners
#     bundled in the flavors were evaluated and each detects less.

APPLY_FIXES: none

# MegaLinter treats formatter findings as non-blocking by DEFAULT, so a
# formatter can report errors while the job still concludes success — and this
# feeds ci-required. Without this line the gate is decorative.
FORMATTERS_DISABLE_ERRORS: false

# A linter named here but absent from the flavor is an error rather than a
# silent skip. Otherwise picking the wrong flavor removes checks invisibly.
FAIL_IF_MISSING_LINTER_IN_FLAVOR: true

SHOW_ELAPSED_TIME: true
PRINT_ALPACA: false

ENABLE_LINTERS:
  - ACTION_ACTIONLINT
  - BASH_SHELLCHECK
  - EDITORCONFIG_EDITORCONFIG_CHECKER
  - GO_GOLANGCI_LINT
  - MARKDOWN_MARKDOWNLINT
  - SPELL_CSPELL
  - YAML_YAMLLINT

# build/ and dist/ are generated. internal/assets/ holds byte-identical copies
# of filters/ and styles/, embedded with go:embed and asserted equal by
# internal/assets/assets_test.go — linting both reports every finding twice.
FILTER_REGEX_EXCLUDE: '(^|/)(build|dist)/|^internal/assets/(filters|styles)/'

MARKDOWN_MARKDOWNLINT_CONFIG_FILE: .markdownlint.yaml
# CHANGELOG.md is generated by git-cliff from commit bodies, so a finding in it
# is a finding in the template or in a commit message that has already landed —
# not something a contributor can fix in the file. examples/ are pandoc input
# FIXTURES, deliberately containing wide and awkward tables, which is the whole
# point of examples/wide-table.md.
MARKDOWN_FILTER_REGEX_EXCLUDE: '(^|/)CHANGELOG\.md$|^examples/'
YAML_YAMLLINT_CONFIG_FILE: .yamllint.yml
GO_GOLANGCI_LINT_CONFIG_FILE: .golangci.yml

# Spelling is worth it where a typo is user-facing. Running it over shell and
# LaTeX would be mostly noise.
SPELL_CSPELL_FILE_EXTENSIONS:
  - .md
SPELL_CSPELL_CONFIG_FILE: .cspell.json
