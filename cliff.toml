# git-cliff — CHANGELOG.md and the release notes are BOTH generated from here,
# so there is exactly one source of truth.
#
# The prose in each entry is the pull request description: the working model
# sets squash_merge_commit_message=PR_BODY, so every squash commit on main
# carries it. Generating therefore does NOT reduce entries to one-line subjects,
# which was the mistaken reason this file previously sat unused.
[changelog]
header = """
# Changelog

All notable changes to this project are documented here.

Generated from the commit history by [git-cliff](https://git-cliff.org) — do not
edit by hand, the next release overwrites it. Each entry's prose is the
description of the pull request that introduced the change.

This file is regenerated when a release is prepared, so it lags the history by
the single commit that regenerated it — a commit cannot describe itself. The
**GitHub release notes are authoritative**: they are generated from the history
at the moment the tag is pushed, and are complete.

"""
# One line per change: subject, scope, and a short SHA that links to the commit.
#
# It used to render {{ commit.body }}. Squash-merging puts the entire pull
# request description into the commit body, so the v0.2.0 notes came to 14,014
# bytes across 27 entries — mostly CI changes with multi-paragraph rationale.
# The same range renders as 1,160 bytes and 6 entries this way.
#
# The detail is not lost, it is one click away: the (#NN) that squash-merging
# appends to the subject is auto-linked by GitHub, and the SHA links to the
# commit whose body carries the full reasoning.
#
# The repository URL is a literal rather than {{ remote.link }}. Configuring
# [remote.github] makes git-cliff call the GitHub API for metadata, which needs
# network, a token and a writable cache — it panics in the release container
# without them. A release must not depend on an API call it does not need.
body = """
{% if version %}\
## [{{ version | trim_start_matches(pat="v") }}](https://github.com/cronai-labs/schriftsatz/compare/{{ previous.version }}...{{ version }}) ({{ timestamp | date(format="%Y-%m-%d") }})
{% else %}\
## [Unreleased]
{% endif %}\
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | striptags | trim }}

{% for commit in commits %}\
* {% if commit.scope %}**{{ commit.scope }}:** {% endif %}{{ commit.message }} ([{{ commit.id | truncate(length=7, end="") }}](https://github.com/cronai-labs/schriftsatz/commit/{{ commit.id }}))
{% endfor %}\
{% endfor %}
"""
trim = true
footer = ""

[git]
conventional_commits = true
filter_unconventional = true

# Order matters. The first rule is load-bearing rather than cosmetic:
# GitHub's squash puts the PR description in the body, and these descriptions
# open with "Closes #n". The conventional-commit parser reads a leading
# "Closes #n" as a FOOTER token and then swallows the entire remaining body into
# that footer's value, leaving commit.body null — which is why an earlier
# attempt at this rendered subjects only. Removing the line before parsing lets
# the body parse as a body.
commit_preprocessors = [
  { pattern = '(?m)^(Closes|Fixes|Resolves) #[0-9]+[ \t]*\r?\n+', replace = "" },
  # GitHub's " (#123)" suffix is deliberately KEPT: it is the reader's link back
  # to the pull request and the discussion behind the change.

  # A pull request description is written for reviewers, so it carries sections
  # that are process rather than product. Drop them before they become release
  # notes.
  # No lookahead: git-cliff uses Rust's regex crate, which does not support it.
  # The section is consumed by matching its heading and then every following
  # line that is blank or does not begin a new heading.
  { pattern = '(?m)^#{1,6} (Checklist|Not verified|Needs a secret[^\n]*)[^\n]*\n([^#\n][^\n]*\n|\n)*', replace = "" },
  # Demote every heading in the body. Left alone, a "## Why" from a PR sits at
  # the same level as "## [0.1.0]" and silently breaks the document hierarchy.
  { pattern = '(?m)^#{1,5} ', replace = "#### " },
]

# Only user-visible change bumps the version and appears in the notes.
#
# This is load-bearing in a repository where merging publishes: every type that
# appears here as a group also CUTS A RELEASE. Measured before this changed, a
# single `docs:` commit took v0.2.0 to v0.2.1 and pushed a Homebrew cask for a
# README typo.
#
# skip = true is the only lever that works. no_increment_regex is documented
# upstream but had no effect in git-cliff 2.13.1, tested three ways.
#
# The trade-off is real and belongs in CONTRIBUTING rather than being
# discovered: a PR title is now the decision about whether users get a release
# at all, so a genuine fix labelled `chore:` ships to nobody.
commit_parsers = [
  # <!-- n --> only orders the sections, since group_by sorts alphabetically;
  # the template strips it with `striptags`.
  { message = "^feat", group = "<!-- 0 -->Features" },
  { message = "^fix", group = "<!-- 1 -->Bug Fixes" },
  { message = "^perf", group = "<!-- 2 -->Performance" },
  { message = "^revert", group = "<!-- 3 -->Reverts" },
  # Real work, and none of it is why someone reads release notes.
  { message = "^docs", skip = true },
  { message = "^test", skip = true },
  { message = "^refactor", skip = true },
  { message = "^style", skip = true },
  { message = "^ci", skip = true },
  { message = "^build", skip = true },
  { message = "^chore", skip = true },
]
tag_pattern = "v[0-9]*"

[bump]
# Pre-1.0, a breaking change is a MINOR bump. git-cliff defaults to
# breaking_always_bump_major = true, which would turn the first `feat!:` pull
# request title into a permanent 1.0.0 — and once #30 lands that happens the
# moment the title is merged, with no second look, on a tag that can never be
# moved. Verified against this config: with this line 0.1.1 + `feat(cli)!:`
# gives 0.2.0; without it, 1.0.0. Delete it when 1.0.0 is a decision rather
# than an accident.
breaking_always_bump_major = false
features_always_bump_minor = true
